<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask AI · Age-Care Intelligence</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1f2933; --muted: #616e7c;
      --line: #d9dee4; --accent: #1f5f8b; --ok: #1e7a4c; --warn: #9a6700; --err: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px;
             display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 18px; margin: 0; }
    nav a { color: var(--accent); text-decoration: none; margin-left: 16px; font-size: 14px; }
    main { max-width: 780px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    select, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line);
                       border-radius: 6px; background: #fff; color: var(--text); }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0;
             border-radius: 6px; padding: 10px 20px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { color: var(--muted); font-size: 13px; }
    .status { font-size: 13px; margin-top: 6px; }
    .status.ok { color: var(--ok); } .status.err { color: var(--err); }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 10px; }
    .badge.grounded { background: #e3f4ea; color: var(--ok); }
    .badge.general { background: #fff4d6; color: var(--warn); }
    #answer { white-space: pre-wrap; }
    .error { color: var(--err); }
    .meta { color: var(--muted); font-size: 13px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Ask AI</h1>
    <nav><a href="/">Dashboard</a><a href="/guidance">Guidance</a><a href="/ocr">OCR</a></nav>
  </header>
  <main>
    <div class="card">
      <label for="model">AI model</label>
      <select id="model"><option>Loading...</option></select>
      <div id="ollama" class="status"></div>

      <label for="question" style="margin-top:16px">Your question</label>
      <textarea id="question" placeholder="e.g. What should I check before helping a resident stand up?"></textarea>
      <div class="row">
        <button id="send">Ask</button>
        <span class="hint">Runs on this computer. Smaller models answer faster.</span>
      </div>
    </div>

    <div class="card" id="result" hidden>
      <span id="badge" class="badge"></span>
      <div id="answer"></div>
      <div id="meta" class="meta"></div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let defaultModel = "";

    async function loadModels() {
      const select = $("model");
      try {
        const r = await fetch("/api/ask/models");
        const data = await r.json();
        defaultModel = data.default;
        select.innerHTML = "";
        if (!data.ollama_running) {
          select.add(new Option("No models found", ""));
          setStatus("Ollama is not running. Start it with: ollama serve", "err");
          return;
        }
        for (const name of data.models) {
          const label = name === data.default ? name + " (recommended)" : name;
          select.add(new Option(label, name, false, name === data.default));
        }
        setStatus(data.models.length + " model(s) installed", "ok");
      } catch (e) {
        setStatus("Could not reach the server", "err");
      }
    }

    function setStatus(text, kind) {
      $("ollama").textContent = text;
      $("ollama").className = "status " + kind;
    }

    async function ask() {
      const question = $("question").value.trim();
      if (question.length < 3) { $("question").focus(); return; }
      const btn = $("send");
      btn.disabled = true; btn.textContent = "Thinking...";
      $("result").hidden = false;
      $("badge").textContent = ""; $("badge").className = "badge";
      $("answer").className = ""; $("answer").textContent = "Waiting for the model. On CPU this can take a little while.";
      $("meta").textContent = "";
      const started = Date.now();
      try {
        const r = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, model: $("model").value || null }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Something went wrong");
        $("badge").textContent = data.grounded ? "From approved guidance" : "General answer, not from approved guidance";
        $("badge").className = "badge " + (data.grounded ? "grounded" : "general");
        $("answer").textContent = data.answer;
        const secs = ((Date.now() - started) / 1000).toFixed(1);
        let meta = "Model: " + data.model + " · " + secs + "s";
        if (data.sources.length) meta += " · Sources: " + data.sources.join(", ");
        $("meta").textContent = meta;
      } catch (e) {
        $("answer").className = "error";
        $("answer").textContent = typeof e.message === "string" ? e.message : "Something went wrong";
      } finally {
        btn.disabled = false; btn.textContent = "Ask";
      }
    }

    $("send").addEventListener("click", ask);
    $("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
    });
    loadModels();
  </script>
</body>
</html>
