<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nurse dashboard</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <style>
    :root {
      --bg: #f4f6f5; --card: #ffffff; --ink: #1a2423; --muted: #5b6b6a; --line: #dde3e1;
      --accent: #0a7c73; --green: #1f7a4a; --amber: #9a5700; --red: #b3261e;
      --green-bg: #e3f3e9; --amber-bg: #fff1d6; --red-bg: #fce8e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1716; --card: #172221; --ink: #e6efee; --muted: #9fb3b1; --line: #2a3b39;
        --accent: #3fc1b5; --green: #5ccb8b; --amber: #eba64a; --red: #f2766e;
        --green-bg: #12301f; --amber-bg: #33260f; --red-bg: #3a1917;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
    a { color: var(--accent); }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    header strong { font-size: 17px; margin-right: auto; }
    header nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .demo { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tabs button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 3fr 2fr; } }
    .col { display: grid; gap: 16px; align-content: start; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 4px 0; }
    ul { margin: 4px 0; padding-left: 20px; }
    li { margin: 4px 0; }
    .muted, .src { color: var(--muted); font-size: 13px; }
    .src { display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .refused, .not_done { color: var(--red); }

    /* Care priority card (Tanveer) */
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .level { font-weight: 700; padding: 3px 12px; border-radius: 999px; }
    .level.Green { color: var(--green); background: var(--green-bg); }
    .level.Amber { color: var(--amber); background: var(--amber-bg); }
    .level.Red { color: var(--red); background: var(--red-bg); }
    .step { font-weight: 600; }
    .error { color: var(--red); font-size: 14px; }
    .review { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .review button, .review select, .review textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: var(--card); color: var(--ink); min-height: 40px; }
    .review button { cursor: pointer; font-weight: 600; }
    .review button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .review textarea { flex: 1 1 100%; min-height: 56px; }
  </style>
</head>
<body>
  <header>
    <strong>Age-Care · Nurse dashboard</strong>
    <nav aria-label="Pages">
      <a href="/guidance">Guidance</a>
      <a href="/ocr">Health report OCR</a>
      <a href="/ask">Ask AI</a>
      <a href="/vision">Face and room check</a>
      <a href="/carer">Carer view</a>
    </nav>
  </header>

  <main>
    <p class="demo" id="banner">Demo data only. All residents are fake.</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="Residents"></div>

    <div class="grid">
      <div class="col">
        <section id="priority"></section>
        <section id="resident"></section>
        <section id="care"></section>
        <section id="guide"></section>
      </div>
      <div class="col">
        <section id="needs"></section>
        <section id="contacts"></section>
        <section id="activity"></section>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { role: "nurse", people: [], records: new Map(), approved: new Map(), pending: null, audit: null,
                    selected: null, decisions: new Map(), thinking: new Set() };

    // Build elements with text only, so text from the server can never run as code.
    function h(tag, props, ...kids) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (value === false || value == null) continue;
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const kid of kids.flat()) {
        if (kid == null || kid === false) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(kid));
      }
      return node;
    }
    function fill(id, ...kids) { $(id).replaceChildren(...kids.flat().filter(Boolean)); }
    function whenText(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    // ---------- data ----------
    async function api(path) {
      const headers = { "X-Role": state.role };
      try { const token = localStorage.getItem("agecare_token"); if (token) headers["X-Session-Token"] = token; } catch (e) { /* no storage */ }
      const response = await fetch(path, { headers: headers });
      let data = null;
      try { data = await response.json(); } catch (e) { /* no body */ }
      return { ok: response.ok, status: response.status, data: data };
    }

    // entries from the carer page are saved in their own tables, so add them here
    async function addCarerEntries() {
      const today = await api("/api/carer/today");
      if (!today.ok) return;
      const find = (id) => { for (const [k, r] of state.records) if (String(k) === String(id)) return r; return null; };
      for (const t of today.data.tasks) {
        const rec = find(t.resident_id);
        if (rec) rec.care_record.push({ time: t.created_at.slice(11, 16), task: t.task, status: t.status, by: t.carer });
      }
      for (const c of today.data.concerns) {
        const rec = find(c.resident_id);
        if (rec) rec.concerns.push({ time: c.created_at.slice(11, 16), type: c.type, text: c.note + " (" + c.carer + ")" });
      }
    }

    async function loadAll() {
      const list = await api("/api/residents");
      if (!list.ok) {
        $("banner").className = "error";
        $("banner").textContent = "Can't reach the server. Start it with: python -m uvicorn app.main:app --reload";
        return;
      }
      state.people = list.data;
      state.selected = state.people[0] && state.people[0].resident_id;
      await Promise.all(state.people.map(async (p) => {
        const [rec, ok] = await Promise.all([api("/api/residents/" + p.resident_id + "/records"), api("/api/guidance/" + p.resident_id + "/approved")]);
        state.records.set(p.resident_id, rec.ok ? rec.data : null);
        state.approved.set(p.resident_id, ok.ok ? ok.data : null);
      }));
      await addCarerEntries();
      state.pending = await api("/api/guidance/pending");
      state.audit = await api("/api/audit?limit=8");
      renderAll();
      loadDecision(state.selected);
    }

    // ---------- sections ----------
    function renderTabs() {
      fill("tabs", state.people.map((p) => {
        const tab = h("button", { type: "button", role: "tab", "aria-selected": String(p.resident_id === state.selected), text: p.name });
        tab.addEventListener("click", () => select(p.resident_id));
        return tab;
      }));
    }

    function renderResident(person, rec) {
      if (!rec) { fill("resident", h("h2", { text: person.name }), h("p", { class: "muted", text: "No records found." })); return; }
      const hist = rec.readings_history;
      const last = (key) => hist[key] && hist[key].length ? hist[key][hist[key].length - 1].value : null;
      const rows = [
        ["Pulse", last("pulse"), "bpm"],
        ["Blood pressure", last("systolic") != null && last("diastolic") != null ? last("systolic") + "/" + last("diastolic") : null, "mmHg"],
        ["Temperature", last("temperature"), "°C"],
        ["Oxygen", last("spo2"), "%"],
      ].filter((r) => r[1] != null);
      const allergies = rec.allergies.join(", ") || "None recorded";
      fill("resident",
        h("h2", { text: person.name }),
        h("p", { text: person.conditions.join(" · ") }),
        h("p", {}, h("strong", { text: "Allergies: " }), allergies),
        rows.length ? h("table", {},
          h("tr", {}, h("th", { text: "Latest vital signs" }), h("th", { text: "Value" })),
          rows.map((r) => h("tr", {}, h("td", { text: r[0] }), h("td", { text: r[1] + " " + r[2] })))) : null);
    }

    function renderCare(person, rec) {
      const list = rec ? [...rec.care_record].sort((a, b) => a.time.localeCompare(b.time)) : [];
      const label = { given: "Given", refused: "Refused", not_done: "Not done" };
      fill("care",
        h("h2", { text: "Today's care" }),
        list.length
          ? h("table", {},
              h("tr", {}, h("th", { text: "Time" }), h("th", { text: "Task" }), h("th", { text: "Status" }), h("th", { text: "By" })),
              list.map((c) => h("tr", {}, h("td", { text: c.time }), h("td", { text: c.task }),
                h("td", { class: c.status, text: label[c.status] || c.status }), h("td", { text: c.by }))))
          : h("p", { class: "muted", text: "Nothing recorded yet today." }));
    }

    function renderGuide(person) {
      const ok = state.approved.get(person.resident_id);
      if (!ok) {
        fill("guide", h("h2", { text: "Approved guidance" }),
          h("p", { class: "muted" }, "No approved guidance yet. ", h("a", { href: "/guidance", text: "Draft guidance" })));
        return;
      }
      const list = (lines) => h("ul", {}, lines.map((l) => h("li", {}, l.text, h("span", { class: "src", text: l.edited ? "Written by a nurse" : l.source }))));
      fill("guide",
        h("h2", { text: "Approved guidance" }),
        h("p", { class: "muted", text: "Approved by " + ok.approved_by + ", " + whenText(ok.approved_at) }),
        h("p", {}, h("strong", { text: "Signs to watch for" })), list(ok.watch_for),
        h("p", {}, h("strong", { text: "Prevention steps" })), list(ok.prevention));
    }

    function renderNeeds() {
      const items = [];
      for (const p of state.people) {
        const rec = state.records.get(p.resident_id);
        if (rec) for (const c of rec.concerns) items.push(h("li", {}, h("strong", { text: p.name + " · " + c.type }), " " + c.time,
          h("span", { class: "src", text: "“" + c.text + "”" })));
      }
      if (state.pending && state.pending.ok) {
        for (const d of state.pending.data) items.push(h("li", {}, h("strong", { text: d.resident + " · AI draft" }),
          h("span", { class: "src", text: d.lines + " lines waiting for a nurse" })));
      }
      fill("needs", h("h2", { text: "Needs a nurse" }),
        items.length ? h("ul", {}, items) : h("p", { class: "muted", text: "Nothing needs attention." }));
    }

    function renderContacts(rec) {
      if (!rec) { fill("contacts"); return; }
      fill("contacts", h("h2", { text: "Who to call" }),
        h("ul", {},
          h("li", {}, rec.doctor.name + " (doctor) · " + rec.doctor.phone),
          rec.contacts.map((c) => h("li", { text: c.name + " (" + c.relationship + ") · " + c.phone }))));
    }

    function renderActivity() {
      const head = h("h2", { text: "Recent activity" });
      if (!state.audit || !state.audit.ok) { fill("activity", head, h("p", { class: "muted", text: "Only a nurse can see the audit log." })); return; }
      if (!state.audit.data.length) { fill("activity", head, h("p", { class: "muted", text: "No activity yet." })); return; }
      fill("activity", head, h("ul", {}, state.audit.data.map((e) => h("li", {},
        e.actor + " " + e.action.replace(/_/g, " "), h("span", { class: "src", text: whenText(e.at) + (e.detail ? " · " + e.detail : "") })))));
    }

    // ---------- Care priority: rules + AI, the nurse decides (Tanveer) ----------
    async function loadDecision(id) {
      state.thinking.add(id);
      const quick = await api("/api/residents/" + id + "/decision?use_ai=false"); // rules only: fast
      if (quick.ok && !state.decisions.has(id)) state.decisions.set(id, quick.data);
      if (state.selected === id) renderPriority();
      const full = await api("/api/residents/" + id + "/decision"); // rules + AI: slower
      state.thinking.delete(id);
      if (full.ok) state.decisions.set(id, full.data);
      if (state.selected === id) renderPriority();
    }

    function renderPriority() {
      const d = state.decisions.get(state.selected);
      if (!d) { fill("priority", h("h2", { text: "Care priority" }), h("p", { class: "muted", text: "Checking…" })); return; }
      const thinking = state.thinking.has(d.resident_id);
      fill("priority",
        h("div", { class: "top" }, h("h2", { text: "Care priority" }), h("span", { class: "level " + d.level, text: d.level })),
        h("p", { class: "step", text: d.next_step + (thinking ? " (vital signs only so far)" : "") }),
        d.reasons.length
          ? h("ul", {}, d.reasons.map((r) => h("li", {}, r.text, h("span", { class: "src", text: (r.quote ? "“" + r.quote + "” · " : "") + r.source }))))
          : h("p", { class: "muted", text: "Nothing needs attention." }),
        thinking ? h("p", { class: "muted", text: "Reading carer notes…" }) : null,
        !thinking && d.ai.status === "error" ? h("p", { class: "error", text: "AI not available, so this uses vital signs only." }) : null,
        thinking ? null : reviewPart(d));
    }

    function nurseName() {
      try { return localStorage.getItem("agecare_name") || "Nurse"; } catch (e) { return "Nurse"; }
    }

    function reviewPart(d) {
      const r = d.last_review;
      const done = r ? h("span", { class: "muted", text: (r.action === "priority_accepted" ? "Accepted" : "Changed") + " by " + r.actor + ", " + whenText(r.at) }) : null;
      const accept = h("button", { type: "button", class: "primary", text: "Accept" });
      const change = h("button", { type: "button", text: "Change" });
      const box = h("div", { class: "review" }, accept, change, done);
      accept.addEventListener("click", () => sendReview(d, d.level, ""));
      change.addEventListener("click", () => {
        const pick = h("select", { "aria-label": "New priority" }, ["Green", "Amber", "Red"].filter((l) => l !== d.level).map((l) => h("option", { value: l, text: l })));
        const why = h("textarea", { placeholder: "Reason for the change", "aria-label": "Reason for the change" });
        const save = h("button", { type: "button", class: "primary", text: "Save" });
        const cancel = h("button", { type: "button", text: "Cancel" });
        save.addEventListener("click", () => { if (!why.value.trim()) { why.focus(); return; } sendReview(d, pick.value, why.value); });
        cancel.addEventListener("click", renderPriority);
        box.replaceChildren(pick, why, save, cancel);
        pick.focus();
      });
      return box;
    }

    async function sendReview(d, final, note) {
      const headers = { "Content-Type": "application/json", "X-Role": state.role };
      try { const token = localStorage.getItem("agecare_token"); if (token) headers["X-Session-Token"] = token; } catch (e) { /* no storage */ }
      const response = await fetch("/api/residents/" + d.resident_id + "/decision/review", {
        method: "POST", headers: headers,
        body: JSON.stringify({ reviewer: nurseName(), suggested: d.level, final: final, note: note }),
      });
      let data = null;
      try { data = await response.json(); } catch (e) { /* no body */ }
      if (!response.ok) { alert("Could not save: " + (data && data.detail ? JSON.stringify(data.detail) : response.status)); return; }
      d.last_review = data;
      state.audit = await api("/api/audit?limit=8");
      renderPriority(); renderActivity();
    }

    // ---------- page ----------
    function renderAll() {
      const person = state.people.find((p) => p.resident_id === state.selected);
      if (!person) return;
      const rec = state.records.get(person.resident_id);
      renderTabs(); renderPriority(); renderResident(person, rec); renderCare(person, rec);
      renderGuide(person); renderNeeds(); renderContacts(rec); renderActivity();
    }

    function select(id) {
      state.selected = id;
      renderAll();
      if (!state.decisions.has(id) && !state.thinking.has(id)) loadDecision(id);
    }

    loadAll();
  </script>
  <script src="/static/auth.js"></script>
  <script src="/ai-bubble.js"></script>
</body>
</html>
