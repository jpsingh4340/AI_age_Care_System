<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · AgeCare</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .auth-shell {
      max-width: 440px;
      margin: 36px auto;
    }
    .auth-card {
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      padding: 28px 24px;
      box-shadow: var(--shadow-subtle);
    }
    .auth-header {
      margin-bottom: 20px;
      text-align: left;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
      gap: 16px;
    }
    .auth-tab-btn {
      background: none;
      border: none;
      padding: 8px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }
    .auth-tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      margin-bottom: -1px;
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 40px;
    }
    .eye-toggle-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 40px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
    }
    .google-btn {
      width: 100%;
      min-height: 40px;
      background-color: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-input);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    .google-btn:hover {
      background-color: var(--bg-subtle);
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider-text::before, .divider-text::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--line);
    }
    .divider-text:not(:empty)::before {
      margin-right: 10px;
    }
    .divider-text:not(:empty)::after {
      margin-left: 10px;
    }
    .auth-foot-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 18px;
      font-size: 13px;
    }
    .forgot-btn {
      background: none;
      border: none;
      color: var(--accent);
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="topbar"></header>

  <main class="page-container page-narrow">
    <div class="auth-shell">
      <div class="demo-banner alert-warn" style="margin-bottom: 16px;">
        <strong>Demo prototype only:</strong> Fictional residents and synthetic records. No medical decisions are made without a Registered Nurse.
      </div>

      <div class="auth-card" id="authCard">
        <div class="auth-header">
          <h1 id="authHeading" style="font-size: 21px; margin-bottom: 4px;">Sign in</h1>
          <p id="authSubtitle" class="sub-text">Access your role workspace: Carer, Nurse, Manager, or Whānau.</p>
        </div>

        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" id="tabLogin" onclick="switchTab('login')">Log in</button>
          <button type="button" class="auth-tab-btn" id="tabRegister" onclick="switchTab('register')">Create account</button>
        </div>

        <!-- Google section -->
        <div id="googleLoginSection">
          <button type="button" class="google-btn" id="btnGoogle" onclick="handleGoogleSignIn()">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <div class="divider-text">Or sign in with email</div>
        </div>

        <div id="alertBox" class="alert-box hidden" role="alert"></div>

        <!-- Log in form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email or username</label>
            <input id="loginEmail" type="text" required autocomplete="username" class="field" placeholder="e.g. nurse.sam or nurse@example.com">
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input id="loginPassword" type="password" required autocomplete="current-password" class="field" placeholder="Enter password">
              <button type="button" class="eye-toggle-btn" onclick="togglePassword('loginPassword', this)" aria-label="Show or hide password" title="Show or hide password">Show</button>
            </div>
          </div>

          <div class="auth-foot-action">
            <label class="choice" style="border:0; padding:0; min-height:auto;">
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember me</span>
            </label>
            <button type="button" class="forgot-btn" onclick="handleForgotPassword()">Forgot password?</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
            Sign in
          </button>
        </form>

        <!-- Register form -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regFullName">Full name</label>
            <input id="regFullName" type="text" required class="field" placeholder="e.g. Sarah Johnson">
          </div>

          <div class="form-group">
            <label for="regEmail">Email address</label>
            <input id="regEmail" type="text" required autocomplete="email" class="field" placeholder="e.g. sarah@example.com">
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="password-wrap">
              <input id="regPassword" type="password" required minlength="6" autocomplete="new-password" class="field" placeholder="Minimum 6 characters">
              <button type="button" class="eye-toggle-btn" onclick="togglePassword('regPassword', this)" aria-label="Show or hide password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label>Select role</label>
            <div class="choices" role="radiogroup" aria-label="Select role">
              <label class="choice"><input type="radio" name="regRole" value="carer" checked onchange="onRoleChange()"> Care Assistant</label>
              <label class="choice"><input type="radio" name="regRole" value="nurse" onchange="onRoleChange()"> Registered Nurse</label>
              <label class="choice"><input type="radio" name="regRole" value="manager" onchange="onRoleChange()"> Manager</label>
              <label class="choice"><input type="radio" name="regRole" value="family" onchange="onRoleChange()"> Whānau / Family</label>
            </div>
          </div>

          <div class="form-group hidden" id="residentPickerWrap">
            <label for="regResident">Linked resident (Family accounts)</label>
            <select id="regResident" class="field"></select>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnRegister" style="margin-top: 18px;">
            Create account
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="foot"></footer>

  <script src="/static/firebase-config.js"></script>
  <script src="/static/auth.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendPasswordResetEmail,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const HOME_BY_ROLE = { carer: "/carer", nurse: "/nurse", manager: "/manager", family: "/family" };
    const cfg = window.FIREBASE_CONFIG || {};
    const isFirebaseReady = Boolean(cfg.apiKey && cfg.projectId);
    let fbAuth = null;

    if (isFirebaseReady) {
      try {
        const app = initializeApp(cfg);
        fbAuth = getAuth(app);
      } catch (e) {
        console.warn("Firebase init note:", e);
      }
    }

    window.togglePassword = function (inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const isPwd = inp.type === "password";
      inp.type = isPwd ? "text" : "password";
      btn.textContent = isPwd ? "Hide" : "Show";
    };

    window.switchTab = function (mode) {
      const isLogin = mode === "login";
      document.getElementById("loginForm").classList.toggle("hidden", !isLogin);
      document.getElementById("registerForm").classList.toggle("hidden", isLogin);
      const googleSec = document.getElementById("googleLoginSection");
      if (googleSec) googleSec.classList.toggle("hidden", !isLogin);

      document.getElementById("tabLogin").classList.toggle("active", isLogin);
      document.getElementById("tabRegister").classList.toggle("active", !isLogin);

      document.getElementById("authHeading").textContent = isLogin ? "Sign in" : "Create account";
      document.getElementById("authSubtitle").textContent = isLogin
        ? "Access your role workspace: Carer, Nurse, Manager, or Whānau."
        : "Register your email and pick your role in the care team.";
      hideAlert();
    };

    if (window.location.hash === "#register") window.switchTab("register");

    window.selectedRegRole = function () {
      const checked = document.querySelector("input[name='regRole']:checked");
      return checked ? checked.value : "carer";
    };

    window.onRoleChange = function () {
      document.getElementById("residentPickerWrap").classList.toggle("hidden", window.selectedRegRole() !== "family");
    };

    function showAlert(text, kind) {
      const box = document.getElementById("alertBox");
      box.textContent = text;
      box.className = "alert-box " + (kind === "ok" ? "alert-success" : "alert-danger");
    }

    function hideAlert() {
      document.getElementById("alertBox").className = "alert-box hidden";
    }

    function saveSessionAndGo(data) {
      localStorage.setItem("agecare_session", JSON.stringify(data));
      localStorage.setItem("agecare_token", data.token);
      localStorage.setItem("agecare_role", data.role);
      localStorage.setItem("agecare_name", data.full_name);
      localStorage.setItem("agecare_username", data.username);
      if (data.resident_id) {
        localStorage.setItem("agecare_resident_id", String(data.resident_id));
      } else {
        localStorage.removeItem("agecare_resident_id");
      }
      window.location.href = HOME_BY_ROLE[data.role] || "/carer";
    }

    async function syncFirebaseWithBackend(email, fullName, role, residentId, uid) {
      const res = await fetch("/api/auth/firebase", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          full_name: fullName || "",
          role: role || "carer",
          resident_id: residentId || null,
          firebase_uid: uid || ""
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Could not sync account with AgeCare backend.");
      return data;
    }

    window.handleGoogleSignIn = async function () {
      hideAlert();
      if (!fbAuth) {
        showAlert("Firebase configuration not found. Please sign in with username/password.", "err");
        return;
      }
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(fbAuth, provider);
        const role = window.selectedRegRole();
        const residentId = role === "family" ? Number(document.getElementById("regResident").value) : null;
        const session = await syncFirebaseWithBackend(
          cred.user.email,
          cred.user.displayName || "",
          role,
          residentId,
          cred.user.uid
        );
        showAlert("Signed in as " + session.full_name + " (" + session.role + "). Opening workspace…", "ok");
        setTimeout(() => saveSessionAndGo(session), 200);
      } catch (err) {
        if (err && err.code === "auth/unauthorized-domain" && window.location.hostname === "127.0.0.1") {
          window.location.href = "http://localhost:" + (window.location.port || "8000") + "/login";
          return;
        }
        showAlert(err.message || "Google sign-in could not be completed.", "err");
      }
    };

    window.handleForgotPassword = async function () {
      hideAlert();
      const email = document.getElementById("loginEmail").value.trim();
      if (!email || !email.includes("@")) {
        showAlert("Enter your email address in the field above first, then click 'Forgot password?'.", "err");
        return;
      }
      if (!fbAuth) {
        showAlert("Password reset via email requires Firebase configuration in static/firebase-config.js.", "err");
        return;
      }
      try {
        await sendPasswordResetEmail(fbAuth, email);
        showAlert("Password reset email sent to " + email + ". Check your inbox.", "ok");
      } catch (err) {
        showAlert(err.message || "Could not send password reset email.", "err");
      }
    };

    window.handleLogin = async function (e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      const emailOrUser = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        if (fbAuth && emailOrUser.includes("@")) {
          try {
            const cred = await signInWithEmailAndPassword(fbAuth, emailOrUser, password);
            const role = window.selectedRegRole();
            const residentId = role === "family" ? Number(document.getElementById("regResident").value) : null;
            const session = await syncFirebaseWithBackend(
              cred.user.email,
              cred.user.displayName || "",
              role,
              residentId,
              cred.user.uid
            );
            showAlert("Signed in as " + session.full_name + " (" + session.role + ").", "ok");
            setTimeout(() => saveSessionAndGo(session), 200);
            return;
          } catch (fbErr) {
            // Fall through to local database check
          }
        }

        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: emailOrUser, password: password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Invalid username or password.");
        showAlert("Signed in as " + data.full_name + " (" + data.role + ").", "ok");
        setTimeout(() => saveSessionAndGo(data), 200);
      } catch (err) {
        showAlert(err.message, "err");
      } finally {
        btn.disabled = false;
      }
    };

    window.handleRegister = async function (e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById("btnRegister");
      btn.disabled = true;
      const fullName = document.getElementById("regFullName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const role = window.selectedRegRole();
      const residentId = role === "family" ? Number(document.getElementById("regResident").value) : null;

      try {
        if (fbAuth && email.includes("@")) {
          try {
            const cred = await createUserWithEmailAndPassword(fbAuth, email, password);
            if (fullName) {
              try { await updateProfile(cred.user, { displayName: fullName }); } catch (e) {}
            }
          } catch (fbErr) {
            if (fbErr && fbErr.code === "auth/weak-password") {
              throw new Error("Password should be at least 6 characters.");
            }
          }
        }

        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name: fullName,
            username: email,
            password: password,
            role: role,
            resident_id: residentId
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Could not create account.");

        localStorage.removeItem("agecare_session");
        localStorage.removeItem("agecare_token");
        document.getElementById("registerForm").reset();
        window.switchTab("login");
        document.getElementById("loginEmail").value = email;
        document.getElementById("loginPassword").value = "";
        document.getElementById("loginPassword").focus();
        showAlert("Account created for " + data.full_name + " (" + data.role + "). Please sign in.", "ok");
      } catch (err) {
        showAlert(err.message, "err");
      } finally {
        btn.disabled = false;
      }
    };

    fetch("/api/residents")
      .then((r) => (r.ok ? r.json() : []))
      .then((list) => {
        const sel = document.getElementById("regResident");
        sel.innerHTML = list
          .map((p) => `<option value="${p.resident_id}">${p.name} (Room ${p.room || (100 + Number(p.resident_id))})</option>`)
          .join("");
      });
  </script>
</body>
</html>
