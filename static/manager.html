<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User accounts · AgeCare</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/app.css?v=20261114">
</head>
<body>
  <header class="topbar"></header>

  <main class="page-container">
    <div class="page-head">
      <div>
        <p class="eyebrow">Manager</p>
        <h1>User accounts</h1>
        <p class="lede">Who can sign in, and what each person can see.</p>
      </div>
    </div>

    <div class="grid-layout">
      <div class="stack">
        <section class="card" aria-labelledby="usersTitle">
          <div class="card-header">
            <h2 class="card-title" id="usersTitle">Accounts</h2>
            <span class="sub-text" id="userCount"></span>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead>
                <tr><th>Name</th><th>Username</th><th>Role</th><th>Resident</th><th>Medicines</th><th><span class="sr-only">Actions</span></th></tr>
              </thead>
              <tbody id="userRows">
                <tr><td colspan="6"><div class="skeleton w80"></div><div class="skeleton w60"></div></td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="card" aria-labelledby="addTitle">
          <h2 class="card-title" id="addTitle" style="margin-bottom: 16px;">Add an account</h2>
          <form onsubmit="createUser(event)">
            <div class="grid-equal">
              <div class="form-group">
                <label for="uFullName">Full name</label>
                <input id="uFullName" class="field" type="text" required placeholder="Mere Walker">
              </div>
              <div class="form-group">
                <label for="uUsername">Username or email</label>
                <input id="uUsername" class="field" type="text" required minlength="3" placeholder="mere.walker">
              </div>
              <div class="form-group">
                <label for="uPassword">Temporary password <span class="hint">at least 6 characters</span></label>
                <input id="uPassword" class="field" type="password" required minlength="6">
              </div>
              <div class="form-group">
                <label for="uRole">Role</label>
                <select id="uRole" class="field" onchange="toggleResSelect()">
                  <option value="carer">Carer</option>
                  <option value="nurse">Registered nurse</option>
                  <option value="manager">Manager</option>
                  <option value="family">Family</option>
                </select>
              </div>
            </div>
            <div class="form-group hidden" id="uResWrap">
              <label for="uResident">Family member in care</label>
              <select id="uResident" class="field"></select>
            </div>
            <div class="form-actions" style="margin-top: 4px;">
              <p class="text-sm" id="userMsg" role="status"></p>
              <button type="submit" class="btn btn-primary">Add account</button>
            </div>
          </form>
        </section>
      </div>

      <aside class="card" aria-labelledby="auditTitle">
        <div class="card-header">
          <div>
            <h2 class="card-title" id="auditTitle">Audit log</h2>
            <p class="sub-text">Every sign-off and account change</p>
          </div>
        </div>
        <ol class="audit-list" id="auditList"><li><div class="skeleton w80" style="width: 100%;"></div></li></ol>
      </aside>
    </div>
  </main>

  <footer class="foot"></footer>

  <script src="/static/auth.js?v=20261114c"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const ROLE_NAMES = { carer: "Carer", nurse: "Nurse", manager: "Manager", family: "Family" };
    let residentsMap = {};

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function toggleResSelect() {
      $("uResWrap").classList.toggle("hidden", $("uRole").value !== "family");
    }

    async function loadOverview() {
      const [resP, ovRes, usrRes] = await Promise.all([
        window.authFetch("/api/residents"),
        window.authFetch("/api/manager/overview"),
        window.authFetch("/api/manager/users"),
      ]);

      if (resP.ok) {
        const list = await resP.json();
        const sel = $("uResident");
        sel.replaceChildren();
        list.forEach((p) => {
          residentsMap[p.resident_id] = p.name;
          sel.add(new Option(p.name + " (Room " + (100 + Number(p.resident_id)) + ")", p.resident_id));
        });
      }

      if (ovRes.ok) {
        const data = await ovRes.json();
        const auditList = $("auditList");
        auditList.replaceChildren();
        if (!data.audit || !data.audit.length) {
          auditList.appendChild(el("li", "empty", "Nothing logged yet."));
        } else {
          data.audit.forEach((a) => {
            const body = el("span", "text-sm");
            body.append(el("strong", "", a.actor + " "), document.createTextNode((a.action || "").replace(/_/g, " ") + (a.detail ? ". " + a.detail : "")));
            const li = el("li");
            li.append(el("span", "audit-time", (a.at || "").slice(5, 16).replace("T", " ")), body);
            auditList.appendChild(li);
          });
        }
      }

      if (usrRes.ok) {
        const users = await usrRes.json();
        $("userCount").textContent = users.length + (users.length === 1 ? " account" : " accounts");
        const uBody = $("userRows");
        uBody.replaceChildren();
        const myUser = (localStorage.getItem("agecare_username") || "").toLowerCase();

        users.forEach((u) => {
          const tr = uBody.insertRow();
          tr.insertCell().textContent = u.full_name;
          const tdUser = tr.insertCell();
          tdUser.className = "text-mono";
          tdUser.textContent = u.username;
          tr.insertCell().append(el("span", "role-badge", ROLE_NAMES[u.role] || u.role));
          const tdRes = tr.insertCell();
          tdRes.className = "sub-text";
          tdRes.textContent = u.resident_id ? residentsMap[u.resident_id] || "Resident " + u.resident_id : "";
          const tdMed = tr.insertCell();
          if (u.role === "carer") {
            const lab = el("label", "inline");
            lab.style.cssText = "margin: 0; font-weight: 500; cursor: pointer; flex-wrap: nowrap;";
            const sw = el("input", "switch");
            sw.type = "checkbox";
            sw.setAttribute("role", "switch");
            sw.checked = Boolean(u.med_competent);
            sw.setAttribute("aria-label", "Signed off to give medicines: " + u.full_name);
            const word = el("span", "sub-text", sw.checked ? "Signed off" : "No");
            sw.addEventListener("change", async () => {
              sw.disabled = true;
              const res = await window.authFetch("/api/manager/users/" + encodeURIComponent(u.username) + "/medicines", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ competent: sw.checked }),
              });
              if (!res.ok) sw.checked = !sw.checked;
              word.textContent = sw.checked ? "Signed off" : "No";
              if (window.showToast) window.showToast(res.ok ? (sw.checked ? u.full_name + " can now tick medicine rounds" : u.full_name + " can no longer tick medicine rounds") : "Could not save", !res.ok);
              sw.disabled = false;
            });
            lab.append(sw, word);
            tdMed.append(lab);
          } else {
            tdMed.className = "text-muted";
            tdMed.textContent = u.role === "nurse" ? "Always" : "";
          }
          const act = tr.insertCell();
          act.style.textAlign = "right";
          if (u.username.toLowerCase() !== myUser) {
            const btn = el("button", "btn btn-quiet btn-sm", "Remove");
            btn.type = "button";
            btn.setAttribute("aria-label", "Remove " + u.username);
            btn.onclick = () => removeUser(u.username);
            act.appendChild(btn);
          }
        });
      }
    }

    async function createUser(e) {
      e.preventDefault();
      const role = $("uRole").value;
      const payload = {
        full_name: $("uFullName").value.trim(),
        username: $("uUsername").value.trim(),
        password: $("uPassword").value,
        role: role,
        resident_id: role === "family" ? Number($("uResident").value) : null,
      };
      const res = await window.authFetch("/api/manager/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      const msg = $("userMsg");
      if (!res.ok) {
        msg.textContent = typeof data.detail === "string" ? data.detail : "Could not add the account.";
        msg.className = "text-sm alert-danger";
        return;
      }
      msg.textContent = "Added " + data.username + " as " + (ROLE_NAMES[data.role] || data.role) + ".";
      msg.className = "text-sm alert-success";
      $("uFullName").value = "";
      $("uUsername").value = "";
      $("uPassword").value = "";
      loadOverview();
    }

    async function removeUser(username) {
      if (!confirm("Remove the account '" + username + "'? They will no longer be able to sign in.")) return;
      const res = await window.authFetch("/api/manager/users/" + encodeURIComponent(username), { method: "DELETE" });
      if (res.ok) {
        if (window.showToast) window.showToast("Removed " + username);
        loadOverview();
      }
    }

    loadOverview();
  </script>
</body>
</html>
